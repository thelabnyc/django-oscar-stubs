[tox]
isolated_build = True
envlist = stubtest,mypy-plugins

[testenv:stubtest]
runner = uv-venv-runner
deps =
    django>=5.2,<5.3
    django-stubs>=6.1
    mypy>=2.3
    Pillow>=9.1.0
    purl>=0.5
    phonenumbers>=7.0.2
commands =
    python {toxinidir}/run_stubtest.py

[testenv:mypy-plugins]
runner = uv-venv-runner
deps =
    django>=5.2,<5.3
    django-stubs>=6.1
    pytest>=8.0
    pytest-mypy-plugins>=3.0
    mypy>=2.3
commands =
    pytest tests/ {posargs}
